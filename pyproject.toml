[build-system]
requires = [
    "setuptools>=83.0.0",
    "wheel>=0.47.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "decider-con"
version = "1.0.0"
description = ""
requires-python = ">=3.12"
authors = [
    { name = "Helmut Konrad Schewe", email = "helmutus@outlook.com" },
]
dependencies = [
    "callidus>=1.7.1,<2.0.0",
    "configos>=1.0.4,<2.0.0",
    "decider-chapter>=1.0.2,<2.0.0",
    "germania>=1.32.2,<2.0.0",
    "iamraw>=4.95.0,<5.0.0",
    "konradus>=1.0.1,<2.0.0",
    "protoerror>=3.20.4,<4.0.0",
    "texes>=1.0.1,<2.0.0",
    "utilo>=2.112.0,<3.0.0",
]
keywords = []
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = "MIT"
license-files = [
    "LICENSE",
]

[project.readme]
file = "README"
content-type = "text/markdown"

[project.optional-dependencies]
dev = [
    "capita==1.25.3",
    "capita_ref==1.0.1",
    "gennex==1.1.0",
    "hoverpower==1.7.0",
    "rawmaker>=2.40.5,<3.0.0",
    "utilotest==1.1.1",
    "writers>=1.7.1,<2.0.0",
    "mundare>=1.0.2,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/anaticulae/decider-con"
Repository = "https://github.com/anaticulae/decider-con"

[project.scripts]
decider_chapter = "chapter_.cli:main"
decider_smarty = "smarty_.cli:main"
decider_textflow = "textflow_.cli:main"

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]

[tool.semantic_release.changelog]
mode = "init"
output_format = "md"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG"

[tool.semantic_release.commit_parser_options]
patch_tags = [
    "build",
    "chore",
    "ci",
    "deps",
    "docs",
    "fix",
    "perf",
    "refactor",
    "style",
    "test",
]
minor_tags = [
    "feat",
]

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "chapter_",
    "chapter_.features",
    "decider_con",
    "smarty_",
    "smarty_.features",
    "textflow_",
    "textflow_.docref",
    "textflow_.features",
    "textflow_.startend",
    "textflow_.writing",
]
exclude = [
    "tests*",
]

[tool.hoverpower]
packages = [
    "BACHELOR",
    "BOOK",
    "DISS",
    "DOCU",
    "HOME",
    "MASTER",
    "TECH",
]
